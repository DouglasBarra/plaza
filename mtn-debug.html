<!doctype html>
<html><head><meta charset="utf-8"><style>html,body{margin:0;background:#f3f3f0}canvas{display:block}</style></head>
<body><canvas id="c"></canvas>
<script type="module">
// Scratch page (not committed): the town and its mountains only, rendered once per shot.
import * as THREE from 'three';
import { InkRenderer, applyTheme, THEMES } from './src/ink.js';
import { setNight } from './src/life.js';
import { buildTown } from './src/town/index.js';
const canvas = document.getElementById('c');
const W = innerWidth, H = innerHeight;
const renderer = new THREE.WebGLRenderer({ canvas, antialias: false, preserveDrawingBuffer: true });
renderer.setPixelRatio(1); renderer.setSize(W, H, false);
const ink = new InkRenderer(renderer, { samples: 0 }); ink.setSize(W, H);
const scene = new THREE.Scene();
scene.fog = new THREE.Fog(THEMES.day.paper, 70, 180);
const camera = new THREE.PerspectiveCamera(70, W / H, 0.5, 1200);
const ambient = new THREE.AmbientLight(0xffffff, 1);
const sun = new THREE.DirectionalLight(0xffffff, Math.PI); sun.position.set(-14, 26, 12);
scene.add(ambient, sun, sun.target);
const lights = { ambient, sun };
const t0 = performance.now();
const town = buildTown(scene);
window.buildMs = performance.now() - t0;
// a stand-in for the plaza's buildings: a few blocks round the square
const blockMat = new THREE.MeshToonMaterial({ color: '#ffffff' });
for (const [x, z, w, h, d] of [[0, -44, 26, 18, 14], [-40, -30, 14, 14, 18], [40, -30, 16, 12, 18], [-44, 22, 14, 12, 18], [44, 22, 14, 12, 18], [-20, 44, 16, 10, 12], [20, 44, 14, 16, 12]]) {
  const b = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), blockMat); b.position.set(x, h / 2, z); scene.add(b);
}
window.shot = (pos, target, fov = 70, night = false) => {
  applyTheme(night ? 'night' : 'day', lights); ink.setTheme(night ? 'night' : 'day'); setNight(night);
  scene.fog.color.set(THEMES[night ? 'night' : 'day'].paper);
  camera.fov = fov; camera.updateProjectionMatrix();
  camera.position.set(...pos); camera.lookAt(...target);
  const d = camera.position.distanceTo(new THREE.Vector3(...target));
  ink.setFog(Math.max(70, d + 30), Math.max(180, d + 150));
  town.animate(1);
  ink.render(scene, camera, 1);
  return true;
};
window.scene = scene; window.THREE = THREE;
window.ready = true;
</script></body></html>
